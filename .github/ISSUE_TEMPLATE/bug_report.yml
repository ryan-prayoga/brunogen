name: Bug report
description: Report incorrect inference, generation, or CLI behavior
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - Laravel
        - Express.js
        - Go Gin
        - Go Fiber
        - Go Echo
        - Other
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal fixture
      description: Paste or link a minimal reproducible route/controller/handler. Do not include secrets or private code.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output
      description: Expected OpenAPI/Bruno behavior.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: Actual OpenAPI/Bruno behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Brunogen version
      placeholder: "0.4.14"
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "20.x"
